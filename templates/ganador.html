<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sorteo Final</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: white; }
        #ruletaFinal {
            font-size: 80px;
            font-weight: bold;
            transition: transform 0.2s ease;
        }
    </style>
</head>
<body class="p-4">

<div class="container text-center">

    <h1 class="mb-4">🎰 Sorteo Final</h1>

    <div id="ruletaFinal">🎯</div>

    <button onclick="girarFinal()" class="btn btn-warning mt-4">
        Girar Ruleta Final
    </button>

    <div class="mt-4">
        <a href="/" class="btn btn-secondary">Volver</a>
    </div>

</div>

<script>
async function girarFinal() {

    const ruleta = document.getElementById("ruletaFinal");
    let contador = 0;

    const intervalo = setInterval(() => {
        ruleta.innerText = Math.floor(Math.random() * 150) + 1;
        ruleta.style.transform = "scale(1.3)";
        setTimeout(() => ruleta.style.transform = "scale(1)", 100);

        contador++;
        if (contador > 30) clearInterval(intervalo);

    }, 80);

    setTimeout(async () => {

        const res = await fetch('/api/ganador');
        const data = await res.json();

        if (data.numero) {
            ruleta.innerText = data.numero;
            alert("🏆 Ganador: " + data.usuario +
                  "\nNúmero: " + data.numero);
        } else {
            ruleta.innerText = "❌";
            alert(data.error);
        }

    }, 2500);
}
</script>

</body>
</html>
